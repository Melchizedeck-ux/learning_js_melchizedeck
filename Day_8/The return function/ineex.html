<!DOCTYPE html>
<html>

<body>
    <h1>Javascript Functions</h1>
    <h2>The return Function</h2>
    <p>a function that return the values</p>
    <p id="demo"></p>
    <script>
        function multiply(a, b) {
            return a * b;
        }
        let answer = multiply(7, 9);
        document.getElementById("demo").innerHTML = answer;
    </script>
</body>

</html>
