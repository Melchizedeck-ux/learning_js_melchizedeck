<!DOCTYPE html>
<html>

<body>
    <h1>JavaScript Functions</h1>
    <p> Addition function in javascript</p>
    <p id="demo"></p>
    <script>
        function add(a, b) {
            return a + b;
        }
        let sum1 = add(5, 5);
        let sum2 = add(50, 75);
        document.getElementById("demo").innerHTML = "The results are" + sum1 + "and" + sum2;
    </script>
</body>

</html>
