<!DOCTYPE html>
<html>

<head>
    <title>For Loop Example</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="box">
        <h1>For Loop </h1>
        <p> Count form 1 to 5</p>
        <button onclick="runloop()"> Run For loop</button>
        <div id="output" class="output">
            <span>Click the button</span>
        </div>
        <div class="note"> Used when you know how many time you want to repeat</div>
    </div>
    <script>
        function runloop() {
            let result = "";
            for (let i = 1; i <= 5; i++) {
                result += `<span>${i}</span>`;
            }
            document.getElementById("output").innerHTML = result;
        }
    </script>
</body>

</html>
